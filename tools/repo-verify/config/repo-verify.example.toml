version = 1

[settings]
fail_fast = false

[[check]]
name = "README"
type = "file_exists"
path = "README.md"

[[check]]
name = "No .env"
type = "path_absent"
path = ".env"

[[check]]
name = "Version"
type = "matches"
path = "VERSION"
regex = '^[0-9]+\.[0-9]+\.[0-9]+$'

[[check]]
name = "Tests"
type = "command"
argv = ["./scripts/test"]
cwd = "."
timeout_seconds = 120
